name: 🧹 Cleanup Gitee Test Releases

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete test releases and tags
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          REPO="SususuChang/BlackGoldAncientSword"
          TOKEN="$GITEE_TOKEN"
          API="https://gitee.com/api/v5/repos/$REPO"

          echo "===== Listing all test releases ====="

          for page in 1 2; do
            releases=$(curl -s "$API/releases?access_token=$TOKEN&per_page=20&page=$page")
            count=$(echo "$releases" | jq '. | length')
            if [ "$count" = "0" ] || [ -z "$count" ]; then break; fi

            for row in $(echo "$releases" | jq -c '.[] | select(.tag_name | test("^v0\\.0\\.0\\.test")) | {id, tag_name}'); do
              id=$(echo "$row" | jq -r '.id')
              tag=$(echo "$row" | jq -r '.tag_name')
              echo "Deleting: $tag (ID=$id)"

              # Delete release by ID (correct endpoint)
              http_code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$API/releases/$id?access_token=$TOKEN")
              echo "  Delete release: HTTP $http_code"

              # Delete tag
              http_code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$API/tags/$tag?access_token=$TOKEN")
              echo "  Delete tag: HTTP $http_code"

              # Delete refs tag (might not exist)
              curl -s -X DELETE "$API/git/refs/tags/$tag?access_token=$TOKEN" > /dev/null 2>&1
            done
          done

          echo "===== Verifying cleanup ====="
          remaining=$(curl -s "$API/releases?access_token=$TOKEN&per_page=20" | jq '[.[] | select(.tag_name | test("^v0\\.0\\.0\\.test"))] | length')
          echo "Remaining test releases: $remaining"

          echo "===== Cleanup complete ====="