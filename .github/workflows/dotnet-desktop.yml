name: Release Build & Publish

permissions:
  contents: write

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: Gitee Release — 构建 + 分卷打包 + Gitee 标签/发布/上传
  #         成功后，产物传给 github-release job
  # ============================================================
  gitee-sync:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      release_body: ${{ steps.changelog.outputs.release_body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"


      - name: Determine version from git tags
        id: version
        shell: powershell
        run: |
          # 4 段版本号 Major.Minor.Patch.Build，每段 0-99，溢出向高位进位
          function Bump-Version([string]$v) {
            $p = $v -split '\.'
            $major = [int]$p[0]
            $minor = [int]$p[1]
            $patch = [int]$p[2]
            $build = [int]$p[3]
            $build++
            if ($build -gt 99) { $build = 0; $patch++ }
            if ($patch -gt 99) { $patch = 0; $minor++ }
            if ($minor -gt 99) { $minor = 0; $major++ }
            return "$major.$minor.$patch.$build"
          }

          $latestTag = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+\.\d+$' } | Select-Object -First 1

          if (-not $latestTag) {
            $newVersion = "1.0.0.0"
            Write-Host "No existing 4-segment version tags. Starting at $newVersion"
          } else {
            $latestTag -match '^v(\d+\.\d+\.\d+\.\d+)$' | Out-Null
            $current = $Matches[1]
            $newVersion = Bump-Version $current
            Write-Host "Latest tag: $latestTag -> candidate v$newVersion"

            $allTags = git tag
            while ($allTags -contains "v$newVersion") {
              $newVersion = Bump-Version $newVersion
              Write-Host "Tag v$newVersion exists, bumped to v$newVersion"
            }
          }

          "new_version=$newVersion" >> $env:GITHUB_OUTPUT


      - name: Patch App csproj version
        shell: powershell
        run: |
          $ver = "${{ steps.version.outputs.new_version }}"
          $proj = "src/BlackGoldAncientSword.App/BlackGoldAncientSword.App.csproj"
          $content = Get-Content $proj -Raw -Encoding UTF8
          $content = $content -replace '<Version>[\d\.]+</Version>', "<Version>$ver</Version>"
          $content = $content -replace '<AssemblyVersion>[\d\.]+</AssemblyVersion>', "<AssemblyVersion>$ver</AssemblyVersion>"
          $content = $content -replace '<FileVersion>[\d\.]+</FileVersion>', "<FileVersion>$ver</FileVersion>"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$pwd/$proj", $content, $utf8NoBom)
          Write-Host "Patched csproj -> Version=$ver"


      - name: Build
        shell: powershell
        run: |
          $projPath = "src/BlackGoldAncientSword.App/BlackGoldAncientSword.App.csproj"
          dotnet build $projPath `
            -c Release `
            -r win-x64 `
            /p:Version=${{ steps.version.outputs.new_version }}
          Write-Host "Build completed"


      - name: Publish (self-contained)
        shell: powershell
        run: |
          $projPath = "src/BlackGoldAncientSword.App/BlackGoldAncientSword.App.csproj"
          dotnet publish $projPath `
            -c Release `
            -r win-x64 `
            -o publish/Release `
            --self-contained `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:Version=${{ steps.version.outputs.new_version }}
          Write-Host "Publish completed"


      - name: Publish Updater (self-contained single-file)
        shell: powershell
        run: |
          $updProj = "src/BlackGoldAncientSword.Update/BlackGoldAncientSword.Update.csproj"
          dotnet publish $updProj `
            -c Release `
            -r win-x64 `
            -o publish/Updater `
            --self-contained `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:Version=${{ steps.version.outputs.new_version }}
          Write-Host "Updater self-contained single-file publish completed"


      - name: Merge build + publish output
        shell: powershell
        run: |
          $buildDir = "src/BlackGoldAncientSword.App/bin/Release/net10.0-windows/win-x64"
          $publishDir = "publish/Release"
          $updaterDir = "publish/Updater"
          $mergedDir = "publish/Merged"

          New-Item -ItemType Directory -Force -Path $mergedDir | Out-Null

          # 1. Copy all build output as base
          Copy-Item -Path "$buildDir\*" -Destination $mergedDir -Recurse -Force
          Write-Host "Copied build output: $(Get-ChildItem $mergedDir -Recurse | Measure-Object).Count files"

          # 2. Overlay with publish output (publish wins on conflicts)
          Copy-Item -Path "$publishDir\*" -Destination $mergedDir -Recurse -Force
          Write-Host "Overlaid publish output: $(Get-ChildItem $mergedDir -Recurse | Measure-Object).Count files total"

          # 3. 复制独立的 Updater single-file exe 进安装目录
          #    Updater 必须随 App 一起部署，否则"在线更新"按钮 CanOnlineUpdate=false 永远 disabled
          $updaterExe = Join-Path $updaterDir "BlackGoldAncientSword.Update.exe"
          if (-not (Test-Path $updaterExe)) {
            Write-Error "Updater exe not found: $updaterExe"
            exit 1
          }
          Copy-Item -Path $updaterExe -Destination $mergedDir -Force
          Write-Host "Copied Updater exe into merged: $updaterExe"


      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $newTag = "v${{ steps.version.outputs.new_version }}"

          # 找上一个 4 段版本号 tag，排除本次新建的 newTag
          $prevTag = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+\.\d+$' -and $_ -ne $newTag } | Select-Object -First 1

          if (-not $prevTag) {
            $rangeLabel = "初次发版"
            $changelog  = "- 项目首次发版"
          } else {
            $rangeLabel = "$prevTag → $newTag"
            # prev_tag..HEAD 内非 merge、非 [skip ci] commit 标题，附短哈希
            $rawLog = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)" --no-merges --grep='\[skip ci\]' --invert-grep
            if (-not $rawLog) {
              $changelog = "- 本次发版无业务代码改动（仅版本号同步）"
            } else {
              $changelog = ($rawLog | Out-String).TrimEnd()
            }
          }

          $body = "## 本次更新（$rangeLabel）`n`n$changelog"

          # 多行内容写入 GITHUB_OUTPUT，使用 heredoc 分隔符
          $delim = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_body<<$delim"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delim

          Write-Host "===== Changelog ($rangeLabel) ====="
          Write-Host $body


      - name: Create split zip volumes (≤99MB each)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -v99m "$pwd/output/BlackGoldAncientSword-v${{ steps.version.outputs.new_version }}-split.zip" "$pwd/publish/Merged/*"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          curl.exe -L -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH


      - name: Build split installer (DiskSpanning)
        shell: powershell
        run: |
          $issPath = "setup.iss"
          if (-not (Test-Path $issPath)) {
            Write-Error "Inno Setup script not found: $issPath"
            exit 1
          }

          # Replace version placeholder with actual version
          $ver = "${{ steps.version.outputs.new_version }}"
          $issContent = Get-Content $issPath -Raw -Encoding UTF8
          $issContent = $issContent -replace '#define MyAppVersion "[\d\.]+"', "#define MyAppVersion `"$ver`""
          [System.IO.File]::WriteAllText($issPath, $issContent, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Patched setup.iss MyAppVersion -> $ver"

          $p = Start-Process -FilePath "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            -ArgumentList "/DMyAppVersion=${{ steps.version.outputs.new_version }}","/DUseDiskSpanning","$issPath",'/O"output"' `
            -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

          if (-not (Get-ChildItem output/*.exe)) {
            Write-Error "Installer EXE not generated!"
            exit 1
          }


      - name: List files to sync to Gitee
        shell: powershell
        run: |
          Write-Host "Files to sync to Gitee:"
          Get-ChildItem output/* | ForEach-Object {
            Write-Host "  $($_.Name) ($($_.Length) bytes)"
          }


      - name: Sync release to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_BODY: ${{ steps.changelog.outputs.release_body }}
        run: |
          $tag = "v${{ steps.version.outputs.new_version }}"
          $repo = "SususuChang/BlackGoldAncientSword"
          $token = $env:GITEE_TOKEN
          $apiBase = "https://gitee.com/api/v5/repos/$repo"
          [long] $maxSize = 100L * 1024L * 1024L

          Write-Host "===== Syncing release $tag to Gitee ====="

          # 1. Delete existing Gitee release matching this tag (if any)
          Write-Host "  Checking for existing Gitee release: $tag ..."
          $existingRelease = curl.exe --connect-timeout 30 --max-time 60 "$apiBase/releases/tags/$tag?access_token=$token" | ConvertFrom-Json -ErrorAction SilentlyContinue
          if ($existingRelease.id) {
            Write-Host ("    Found existing release ID=$($existingRelease.id), deleting...")
            $success = $false
            for ($r = 0; $r -lt 3; $r++) {
              if ($r -gt 0) { Start-Sleep -Seconds (10 * $r) }
              $p = Start-Process -FilePath 'curl.exe' -NoNewWindow -Wait -PassThru -ArgumentList @(
                '--connect-timeout','30','--max-time','120','-X','DELETE',
                "$apiBase/releases/$($existingRelease.id)?access_token=$token"
              )
              if ($p.ExitCode -eq 0) { $success = $true; break }
              Write-Host ("      Release delete retry " + ($r + 2) + "/3 (exit=" + $p.ExitCode + ")")
            }
            if (-not $success) { Write-Error "Failed to delete existing release $($existingRelease.id)"; exit 1 }
            Write-Host "    Existing release deleted."
          } else {
            Write-Host "    No existing release for $tag, skip."
          }

          # 2. Delete existing Gitee tag matching this tag (if any — try both endpoints)
          Write-Host "  Checking for existing Gitee tag: $tag ..."
          $existingTag = curl.exe --connect-timeout 30 --max-time 60 "$apiBase/tags/$tag?access_token=$token" | ConvertFrom-Json -ErrorAction SilentlyContinue
          if ($existingTag.name) {
            Write-Host ("    Found existing tag $($existingTag.name), deleting...")
            $success = $false
            for ($r = 0; $r -lt 3; $r++) {
              if ($r -gt 0) { Start-Sleep -Seconds (10 * $r) }
              $p = Start-Process -FilePath 'curl.exe' -NoNewWindow -Wait -PassThru -ArgumentList @(
                '--connect-timeout','30','--max-time','120','-X','DELETE',
                "$apiBase/tags/$tag?access_token=$token"
              )
              if ($p.ExitCode -eq 0) { $success = $true; break }
              # Fallback: try /git/refs/tags/ endpoint
              $p = Start-Process -FilePath 'curl.exe' -NoNewWindow -Wait -PassThru -ArgumentList @(
                '--connect-timeout','30','--max-time','120','-X','DELETE',
                "$apiBase/git/refs/tags/$tag?access_token=$token"
              )
              if ($p.ExitCode -eq 0) { $success = $true; break }
              Write-Host ("      Tag delete retry " + ($r + 2) + "/3 (exit=" + $p.ExitCode + ")")
            }
            if (-not $success) { Write-Error "Failed to delete existing tag $tag"; exit 1 }
            Write-Host "    Existing tag deleted."
          } else {
            Write-Host "    No existing tag for $tag, skip."
          }


          # 3. Create release (env var avoids multi-line string interpolation issue)
          $releaseBody = $env:RELEASE_BODY
          $body = @{ access_token = $token; tag_name = $tag; name = "Release $tag"; body = $releaseBody; target_commitish = "main" }
          $createResult = curl.exe --connect-timeout 30 --max-time 120 -X POST "$apiBase/releases" -H "Content-Type: application/json" -d ($body | ConvertTo-Json -Compress)
          $releaseId = ($createResult | ConvertFrom-Json -ErrorAction SilentlyContinue).id
          if (-not $releaseId) {
            $errText = if ($createResult -is [string]) { $createResult } else { ($createResult | Out-String).Trim() }
            Write-Host "FAIL to create Gitee release: $errText"
            exit 1
          }
          Write-Host "  Gitee release created, ID=$releaseId"

          # 3. Upload files ≤100MB
          $uploaded = 0; $skipped = 0
          $total = @(Get-ChildItem output/*).Length
          $fileIdx = 0
          Get-ChildItem output/* | ForEach-Object {
            $fileIdx++
            if ($_.Length -le $maxSize) {
              Write-Host ("  [" + $fileIdx + "/" + $total + "] Upload: " + $_.Name + " (" + ('{0:N1}' -f ($_.Length / 1MB)) + " MB)")

              $maxTimePerFile = [Math]::Max(600, [Math]::Min(7200, [int]($_.Length / 5120 + 300)))
              $success = $false
              for ($retry = 0; $retry -lt 3; $retry++) {
                if ($retry -gt 0) {
                  $waitSec = 15 * [Math]::Pow(2, $retry - 1)
                  Write-Host ("    Retry " + ($retry + 1) + "/3 after " + $waitSec + "s...")
                  Start-Sleep -Seconds $waitSec
                }
                $uploadStart = Get-Date
                $cmdArgs = @('-X','POST',"$apiBase/releases/$releaseId/attach_files",
                  '-F',"access_token=$token",'-F',"file=@$($_.FullName);",
                  '--connect-timeout','30','--max-time',"$maxTimePerFile")
                $proc = Start-Process -FilePath 'curl.exe' -ArgumentList $cmdArgs -NoNewWindow -Wait -PassThru
                $elapsed = (Get-Date) - $uploadStart
                if ($proc.ExitCode -eq 0) { $success = $true; break }
                Write-Host ("    Failed (" + [math]::Round($elapsed.TotalSeconds, 0) + "s, exit=" + $proc.ExitCode + ", max=" + $maxTimePerFile + "s)")
              }
              if (-not $success) { Write-Error ("Upload failed after 3 retries: " + $_.Name); continue }
              $secs = [math]::Round($elapsed.TotalSeconds, 1)
              $mbps = if ($secs -gt 0) { [math]::Round(($_.Length / 1MB) / $secs, 1) } else { 0 }
              Write-Host ("    Done: " + $_.Name + " in " + $secs + "s (" + $mbps + " MB/s)")
              $uploaded++
            } else {
              Write-Host ("  [" + $fileIdx + "/" + $total + "] Skip: " + $_.Name + " (" + ('{0:N1}' -f ($_.Length / 1MB)) + " MB) - over 100MB")
              $skipped++
            }
          }
          Write-Host "===== Gitee done: uploaded=$uploaded skipped=$skipped ====="


      - name: Upload build artifacts for GitHub job
        uses: actions/upload-artifact@v4
        with:
          name: gitee-build-artifacts
          path: publish/
          compression-level: 0
          retention-days: 1


      - name: Cleanup Gitee on failure
        if: failure()
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.new_version }}"
          if (-not $ver) {
            Write-Host "未确定版本号，无需回滚"
            exit 0
          }
          $tag = "v$ver"
          $giteeRepo = "SususuChang/BlackGoldAncientSword"
          $giteeToken = "${{ secrets.GITEE_TOKEN }}"

          Write-Host "===== Gitee 失败回滚开始: $tag ====="

          # 1. 删除 Gitee release（如果已创建）
          try {
            $apiBase = "https://gitee.com/api/v5/repos/$giteeRepo"
            $releaseInfo = curl.exe --connect-timeout 30 --max-time 60 "$apiBase/releases/tags/$tag?access_token=$giteeToken" | ConvertFrom-Json -ErrorAction SilentlyContinue
            if ($releaseInfo.id) {
              curl.exe --connect-timeout 30 --max-time 60 -X DELETE "$apiBase/releases/$($releaseInfo.id)?access_token=$giteeToken" | Out-Null
              Write-Host "[OK] Gitee release $tag 已删除"
            } else {
              Write-Host "[SKIP] Gitee release $tag 不存在"
            }
          } catch {
            Write-Host "[SKIP] Gitee release $tag 删除失败: $_"
          }

          # 2. 删除 Gitee tag（如果已创建）
          try {
            $apiBase = "https://gitee.com/api/v5/repos/$giteeRepo"
            curl.exe --connect-timeout 30 --max-time 60 -X DELETE "$apiBase/tags/$tag?access_token=$giteeToken" | Out-Null
            Write-Host "[OK] Gitee tag $tag 已删除"
          } catch {
            Write-Host "[SKIP] Gitee tag $tag 删除失败: $_"
          }

          Write-Host "===== Gitee 失败回滚结束 ====="
          exit 0


  # ============================================================
  # Job 2: GitHub Release — 仅在 Gitee 成功后执行
  #         创建 GitHub tag、单文件打包、GitHub Release、版本同步
  # ============================================================
  github-release:
    needs: gitee-sync
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Download build artifacts from Gitee job
        uses: actions/download-artifact@v4
        with:
          name: gitee-build-artifacts
          path: .


      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          curl.exe -L -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH


      - name: Tag & Push
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          $ver = "${{ needs.gitee-sync.outputs.new_version }}"

          $tagExists = git ls-remote --tags origin "refs/tags/v$ver"
          if (-not $tagExists) {
            git tag -a "v$ver" -m "Release v$ver"
            git push origin "v$ver"
            Write-Host "Created and pushed tag v$ver"
          } else {
            Write-Host "Tag v$ver already exists on remote, skipping creation"
          }


      - name: Zip merged output (single-file zip, old updater compat)
        id: zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null

          $zipName = "BlackGoldAncientSword-v${{ needs.gitee-sync.outputs.new_version }}.zip"
          $zipPath = "output/$zipName"

          & "C:\Program Files\7-Zip\7z.exe" a -tzip "$pwd/output/$zipName" "$pwd/publish/Merged/*"

          $zipSize = (Get-Item $zipPath).Length
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_size=$zipSize" >> $env:GITHUB_OUTPUT

          Write-Host "Created single zip: $zipPath ($zipSize bytes)"


      - name: Build single-file installer
        shell: powershell
        run: |
          $issPath = "setup.iss"
          if (-not (Test-Path $issPath)) {
            Write-Error "Inno Setup script not found: $issPath"
            exit 1
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ needs.gitee-sync.outputs.new_version }} `
            $issPath `
            /O"output"

          if (-not (Get-ChildItem output/*.exe)) {
            Write-Error "Installer EXE not generated!"
            exit 1
          }


      - name: List all output installer files
        shell: powershell
        run: |
          Write-Host "All output files:"
          Get-ChildItem output/* | ForEach-Object {
            "installer_file=$($_.Name)" >> $env:GITHUB_OUTPUT
            Write-Host ("  " + $_.Name + " (" + $_.Length + " bytes)")
          }


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gitee-sync.outputs.new_version }}
          name: Release v${{ needs.gitee-sync.outputs.new_version }}
          draft: false
          prerelease: false
          body: ${{ needs.gitee-sync.outputs.release_body }}
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Commit version bump to release
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          $ver = "${{ needs.gitee-sync.outputs.new_version }}"
          $proj = "src/BlackGoldAncientSword.App/BlackGoldAncientSword.App.csproj"

          git add $proj
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "csproj 无版本变更，跳过 commit"
          } else {
            $msg = "chore: 同步 App 版本号到 v$ver [skip ci]"
            $msgPath = "$env:RUNNER_TEMP/commit-msg-release.txt"
            $utf8NoBom = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::WriteAllText($msgPath, $msg, $utf8NoBom)
            git commit -F $msgPath
            Write-Host "Committed csproj version bump to release (skip push - branch is protected)"
          }


      - name: Sync version to main
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          $ver = "${{ needs.gitee-sync.outputs.new_version }}"
          $proj = "src/BlackGoldAncientSword.App/BlackGoldAncientSword.App.csproj"

          git fetch origin main
          git checkout -B main origin/main

          $content = Get-Content $proj -Raw -Encoding UTF8
          $content = $content -replace '<Version>[\d\.]+</Version>', "<Version>$ver</Version>"
          $content = $content -replace '<AssemblyVersion>[\d\.]+</AssemblyVersion>', "<AssemblyVersion>$ver</AssemblyVersion>"
          $content = $content -replace '<FileVersion>[\d\.]+</FileVersion>', "<FileVersion>$ver</FileVersion>"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$pwd/$proj", $content, $utf8NoBom)

          git add $proj
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "main csproj 已是 v$ver，跳过"
          } else {
            $msg = "chore: 同步 App 版本号到 v$ver [skip ci]"
            $msgPath = "$env:RUNNER_TEMP/commit-msg-main.txt"
            [System.IO.File]::WriteAllText($msgPath, $msg, $utf8NoBom)
            git commit -F $msgPath
            git push origin main
            Write-Host "Synced csproj version v$ver to main"
          }


      - name: Cleanup GitHub on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ver = "${{ needs.gitee-sync.outputs.new_version }}"
          if (-not $ver) {
            Write-Host "未确定版本号，无需回滚"
            exit 0
          }
          $tag = "v$ver"
          $repo = "${{ github.repository }}"

          Write-Host "===== GitHub 失败回滚开始: $tag ====="

          # 1. 删除 GitHub release + tag（gh CLI --cleanup-tag 同时删 release 与 tag）
          try {
            gh release delete $tag -y --cleanup-tag -R $repo
            Write-Host "[OK] GitHub release/tag $tag 已删除"
          } catch {
            Write-Host "[SKIP] GitHub release $tag 不存在或删除失败: $_"
          }

          # 2. 兜底再删一次远端 tag（防止 gh --cleanup-tag 不可用）
          try {
            git push origin --delete $tag 2>$null
            Write-Host "[OK] 远端 tag $tag 兜底删除完成"
          } catch {
            Write-Host "[SKIP] 远端 tag $tag 删除兜底失败: $_"
          }

          Write-Host "===== GitHub 失败回滚结束 ====="

          # 3. Gitee 回滚：gitee-sync 已成功，Gitee release + tag 必然已存在，必须清理
          Write-Host "===== Gitee 失败回滚开始 ====="
          $giteeRepo = "SususuChang/BlackGoldAncientSword"
          $giteeToken = $env:GITEE_TOKEN
          $giteeApi = "https://gitee.com/api/v5/repos/$giteeRepo"

          try {
            $releaseInfo = curl.exe --connect-timeout 30 --max-time 60 "$giteeApi/releases/tags/$tag?access_token=$giteeToken" | ConvertFrom-Json -ErrorAction SilentlyContinue
            if ($releaseInfo.id) {
              curl.exe --connect-timeout 30 --max-time 60 -X DELETE "$giteeApi/releases/$($releaseInfo.id)?access_token=$giteeToken" | Out-Null
              Write-Host "[OK] Gitee release $tag 已删除"
            } else {
              Write-Host "[SKIP] Gitee release $tag 不存在"
            }
          } catch {
            Write-Host "[SKIP] Gitee release 删除失败: $_"
          }

          try {
            curl.exe --connect-timeout 30 --max-time 60 -X DELETE "$giteeApi/tags/$tag?access_token=$giteeToken" | Out-Null
            Write-Host "[OK] Gitee tag $tag 已删除"
          } catch {
            Write-Host "[SKIP] Gitee tag 删除失败: $_"
          }

          Write-Host "===== Gitee 失败回滚结束 ====="
          Write-Host "===== GitHub 失败回滚结束 ====="

          Write-Host "注意: release / main 分支已 push 的版本号 commit 未回滚（避免强推），下次发版会从已有 tag 继续递增"
          exit 0
