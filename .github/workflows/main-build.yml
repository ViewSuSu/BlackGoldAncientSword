name: Main Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: dotnet build src/BlackGoldAncientSword.slnx
